<style>

.study{margin:0;display:flex;flex-direction:column;gap:18px}.study>figcaption{max-width:402px;color:#293b32;font:500 15px/1.5 var(--sf)}.study>figcaption strong{display:block;font-size:21px;color:#11271d;margin-bottom:4px;letter-spacing:-.4px}

.screen button{appearance:none;border:0;color:inherit;font:inherit;cursor:default;padding:0;background:none;display:flex;align-items:center;justify-content:center;flex:none;min-height:44px;min-width:44px}
svg.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.symbols{position:absolute;width:0;height:0;overflow:hidden}
.app{position:absolute;inset:var(--safe-top) 0 var(--safe-bottom);display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none;height:48px;gap:12px}.toolbar .circle{border-radius:50%;width:44px;height:44px}.toolbar .bar-title{font-size:15px;font-weight:600;letter-spacing:-.25px}.toolbar .demo{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12px}.demo .dot{width:5px;height:5px;background:currentColor;border-radius:50%}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:18px 20px 0;flex:none}.heading .eyebrow{font:400 13px/18px var(--sf);color:var(--ink-2);margin-bottom:4px}.heading h1{margin:0;font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-1.8px}.a .heading h1{font:600 34px/1.2 'IBM Plex Mono',monospace;letter-spacing:-1.5px}.b .heading h1{font:800 44px/1.05 'Archivo',sans-serif;letter-spacing:-1.7px}.c .heading h1{font:800 40px/1.05 var(--sf-rounded);letter-spacing:-1.2px}
.lap{display:flex;flex-direction:column;align-items:flex-end;padding-bottom:3px;gap:5px}.lap .label{font-size:12px;color:var(--ink-2)}.lap .value{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.7px;font-variant-numeric:tabular-nums}.lap .value .dim{font-weight:400;color:var(--ink-2);font-size:15px}.a .lap .value{font-family:'IBM Plex Mono',monospace;font-weight:400}.c .lap .value{font-family:var(--sf-rounded);font-weight:700;font-size:22px}
.lap-progress{margin:17px 20px 0;display:grid;grid-template-columns:repeat(53,1fr);gap:3px;height:3px;flex:none}.lap-progress i{height:3px;background:var(--rule);border-radius:1px}.lap-progress i.passed{background:var(--accent)}
.stage{flex:1;min-height:0;position:relative;margin-top:12px;container-type:size;display:grid;place-items:center;isolation:isolate}.render-box{width:min(100cqw,calc(100cqh * var(--ratio,1.5)));aspect-ratio:var(--ratio,1.5);position:relative;flex:none}.render-box img{display:block;width:100%;height:100%;object-fit:contain}.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:5px 7px;border:1px solid var(--rule);background:var(--raised);border-radius:6px;font:600 11px/14px var(--sf);white-space:nowrap;display:flex;align-items:center;gap:5px;letter-spacing:.1px;box-shadow:0 2px 5px #0002}.leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}.leaders path{stroke:var(--ink-2);stroke-width:1;fill:none;opacity:.8}.leaders circle{stroke:var(--ground);stroke-width:.8}.pin .stripe{height:11px;width:2px;background:#ee9238;border-radius:2px}.pin.second .stripe{background:#739bd0}
.world-meta{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-top:4px;flex:none;height:44px;font-size:12px;color:var(--ink-2)}.world-meta .gesture{display:flex;align-items:center;gap:7px}.world-meta .gesture .icon{width:16px;height:16px}.world-meta button{color:var(--ink)}

<script>
for(const p of document.querySelectorAll('.lap-progress')){for(let i=0;i<53;i++){const t=document.createElement('i');if(i<31)t.className='passed';p.appendChild(t)}}
const callouts={a:{NOR:[.64,.20],VER:[.25,.50]},b:{NOR:[.61,.29],VER:[.23,.52]},c:{NOR:[.44,.23],VER:[.29,.67]}};
const NS='http://www.w3.org/2000/svg';
for(const box of document.querySelectorAll('[data-model]')){
 const m=window.MODELS[box.dataset.model];box.style.setProperty('--ratio',m.ratio);
 const lines=document.createElementNS(NS,'svg');lines.classList.add('leaders');lines.setAttribute('aria-hidden','true');box.prepend(lines);
 for(const pin of box.querySelectorAll('[data-car]')){const xy=callouts[box.dataset.model][pin.dataset.car];pin.style.left=xy[0]*100+'%';pin.style.top=xy[1]*100+'%'}
 function draw(){const br=box.getBoundingClientRect();if(!br.width||!br.height)return;lines.setAttribute('viewBox',`0 0 ${br.width} ${br.height}`);lines.replaceChildren();for(const pin of box.querySelectorAll('[data-car]')){const pr=pin.getBoundingClientRect();const xy=m.positions[pin.dataset.car];const x=xy[0]*br.width,y=xy[1]*br.height,cx=pr.left-br.left+pr.width/2,cy=pr.top-br.top+pr.height/2;const dx=x-cx,dy=y-cy;const t=Math.min((pr.width/2)/Math.abs(dx||.001),(pr.height/2)/Math.abs(dy||.001));const line=document.createElementNS(NS,'path');line.setAttribute('d',`M${x} ${y}L${cx+dx*t} ${cy+dy*t}`);const dot=document.createElementNS(NS,'circle');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r','1.8');dot.setAttribute('fill',pin.dataset.car==='NOR'?'#ee9238':'#739bd0');lines.append(line,dot)}}
 new ResizeObserver(draw).observe(box);document.fonts.ready.then(()=>requestAnimationFrame(draw));
}
</script>
