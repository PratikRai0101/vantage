<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.intro{font-size:12px;color:var(--muted-foreground);line-height:1.6;margin:0 0 14px}.intro strong{color:var(--foreground);font-weight:550}.controls{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.controls button{min-height:44px;padding:0 13px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted-foreground);font:12px var(--font-sans);cursor:pointer}.controls button[aria-pressed=true]{background:var(--secondary);color:var(--foreground)}button:focus-visible{outline:2px solid var(--ring);outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.shot{display:block;min-width:0;border:0;background:none;color:var(--foreground);text-align:left;padding:0;cursor:zoom-in}.shot img{width:100%;height:auto;display:block;border-radius:9px}.shot span{display:block;font-size:11px;line-height:1.5;margin:9px 0 0}.shot small{display:block;font-size:10px;color:var(--muted-foreground);margin-top:2px}.grid.focus{grid-template-columns:minmax(0,402px);justify-content:center}.grid.focus .shot{cursor:default}.grid.focus .shot:not(.selected){display:none}.note{font-size:10px;line-height:1.7;color:var(--muted-foreground);margin:15px 0 0}@media(max-width:520px){#all{display:none}.controls{gap:5px}.controls button{flex:1;padding:0 7px}.grid{grid-template-columns:minmax(0,402px);justify-content:center}.grid .shot:not(.selected){display:none}}</style></head><body><p class="intro"><strong>Captured from the running replay.</strong><br>Suzuka 2024 · 17 moving cars · Recorded data, reconstructed geometry</p><div class="controls" role="group" aria-label="Captured prototype views"><button id="all" aria-pressed="true" data-view="all">All views</button><button aria-pressed="false" data-view="0">Whole field</button><button aria-pressed="false" data-view="1">Follow</button><button aria-pressed="false" data-view="2">Telemetry</button></div><div class="grid" id="grid"><button class="shot selected" data-shot="0" aria-label="Enlarge whole-field screenshot"><img src="/Users/pratikrai/.t3/scratch/2026-10-17-we-are-designing-an-iphone-8faf2666/shots/replay/presentation/402-race.webp" alt="Running historical replay with miniature Suzuka, reconstructed field, camera choices and timeline"><span>The whole field</span><small>Replay cursor 00:47.5</small></button><button class="shot" data-shot="1" aria-label="Enlarge driver-follow screenshot"><img src="/Users/pratikrai/.t3/scratch/2026-10-17-we-are-designing-an-iphone-8faf2666/shots/replay/presentation/402-follow.webp" alt="Actual 3D camera following Norris through the miniature Suzuka chicane"><span>Anchored follow camera</span><small>Replay cursor 00:47.5</small></button><button class="shot" data-shot="2" aria-label="Enlarge recorded telemetry screenshot"><img src="/Users/pratikrai/.t3/scratch/2026-10-17-we-are-designing-an-iphone-8faf2666/shots/replay/presentation/402-lab.webp" alt="Recorded Norris and Verstappen speed traces with shared replay scrubber and binary brake readout"><span>Linked telemetry</span><small>Replay cursor 01:02.5</small></button></div><p class="note">These are captures, not an embedded player. The local prototype contains the moving 3D scene, orbit controls, timing and seekable replay.</p><script>const grid=document.getElementById('grid'),media=matchMedia('(max-width:520px)');function show(id){if(id==='all'&&media.matches)id='0';grid.classList.toggle('focus',id!=='all');document.querySelectorAll('[data-shot]').forEach(b=>b.classList.toggle('selected',id==='all'||b.dataset.shot===id));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===id));}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>show(b.dataset.shot));media.addEventListener('change',()=>show(media.matches?'0':'all'));show(media.matches?'0':'all');window.addEventListener('load',()=>console.log('Gallery images loaded:',[...document.images].every(i=>i.complete&&i.naturalWidth>0)));</script></body></html>
